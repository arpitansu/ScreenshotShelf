<svg xmlns="http://www.w3.org/2000/svg" width="520" height="676" viewBox="0 0 520 676" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="The menu bar library: search box, pinned screenshots, recent screenshots with auto-delete labels, and the auto-delete setting">
