<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="The clipboard picker: a search box above a list of recently copied text and an image, opened with Control-Command-V">
  <rect x="0" y="0" width="360" height="440" rx="14" fill="#2e3b35"/>

  <rect x="38" y="20" width="284" height="400" rx="16" fill="#1c1c1e" stroke="#ffffff" stroke-opacity="0.14"/>

  <!-- tab switcher: Clipboard selected -->
  <rect x="50" y="32" width="222" height="32" rx="9" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="162" y="34" width="108" height="28" rx="7" fill="#ffffff" fill-opacity="0.18"/>
  <text x="106" y="52.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff" fill-opacity="0.65">Screenshots</text>
  <text x="216" y="52.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Clipboard</text>
  <circle cx="295" cy="48" r="15" fill="#ffffff" fill-opacity="0.14"/>
  <path d="M290 43 L300 53 M300 43 L290 53" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- search field (focused) -->
  <rect x="50" y="76" width="260" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#0a84ff" stroke-width="2"/>
  <text x="60" y="93.5" font-size="12" fill="#ffffff" fill-opacity="0.45">Search clipboard</text>
  <rect x="59" y="83" width="1.5" height="13" fill="#ffffff"/>

  <!-- rows -->
  <rect x="50" y="114" width="260" height="40" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <text x="60" y="138.5" font-size="12" fill="#ffffff">git commit -m "Fix shelf click areas"</text>

  <rect x="50" y="160" width="260" height="40" rx="8" fill="#ffffff" fill-opacity="0.12"/>
  <text x="60" y="184.5" font-size="12" fill="#ffffff">Meeting moved to 4:30</text>
  <!-- hover buttons -->
  <rect x="254" y="169" width="22" height="22" rx="5" fill="#ffffff" fill-opacity="0.1"/>
  <path d="M262.5 174 h5 l-0.8 4.5 l2.6 2.6 h-8.6 l2.6 -2.6 z M265 181 v5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="280" y="169" width="22" height="22" rx="5" fill="#ffffff" fill-opacity="0.1"/>
  <path d="M287.5 176.5 L294.5 183.5 M294.5 176.5 L287.5 183.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>

  <rect x="50" y="206" width="260" height="54" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <clipPath id="imgclip"><rect x="58" y="213" width="60" height="40" rx="5"/></clipPath>
  <g clip-path="url(#imgclip)">
    <rect x="58" y="213" width="60" height="40" fill="#dfe8dc"/>
    <path d="M52 238 L124 226" stroke="#ffffff" stroke-width="4"/>
    <path d="M80 208 L92 258" stroke="#ffffff" stroke-width="4"/>
    <circle cx="96" cy="230" r="5" fill="#c2410c"/>
  </g>
  <text x="128" y="237" font-size="11" fill="#ffffff" fill-opacity="0.55">Image · 5 min ago</text>

  <rect x="50" y="266" width="260" height="40" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <text x="60" y="290.5" font-size="12" fill="#ffffff">Flat 4B, Green Park Apartments</text>
  <path d="M291.5 280 h5 l-0.8 4.5 l2.6 2.6 h-8.6 l2.6 -2.6 z M294 287 v5" fill="#ff9f0a" stroke="#ff9f0a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="50" y="312" width="260" height="40" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <text x="60" y="336.5" font-size="12" fill="#ffffff">npm run build -- --watch</text>

  <!-- footer -->
  <text x="52" y="384" font-size="10" fill="#ffffff" fill-opacity="0.55">⌃⌘V opens this · Return copies the top one</text>
  <text x="308" y="384" text-anchor="end" font-size="10" font-weight="600" fill="#ffffff" fill-opacity="0.55">Pause</text>
</svg>
